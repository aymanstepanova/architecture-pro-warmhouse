openapi: 3.0.3
info:
  title: Telemetry Service API
  version: 1.0.0
  description: |
    API для работы с телеметрическими данными в системе "Тёплый дом".
    Обеспечивает получение метрик, статистики и аналитики по устройствам.
servers:
  - url: http://localhost:8084
    description: Локальный запуск Telemetry Service
tags:
  - name: Metrics
    description: Получение телеметрических данных
  - name: Statistics
    description: Статистика и аналитика
  - name: Health
    description: Проверка состояния сервиса
paths:
  /api/v1/metrics:
    get:
      tags: [Metrics]
      summary: Получить телеметрические данные [PARTLY]
      description: Возвращает метрики устройств с возможностью фильтрации и агрегации (частично реализовано в MVP)
      parameters:
        - name: device_id
          in: query
          description: Фильтр по устройству [WIP]
          schema:
            type: string
            format: uuid
        - name: house_id
          in: query
          description: Фильтр по дому ✅
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Фильтр по локации ✅
          schema:
            type: string
            maxLength: 128
        - name: metric_code
          in: query
          description: Фильтр по типу метрики ✅
          schema:
            type: string
            maxLength: 64
            enum: [temperature, humidity, power, motion, pressure]
        - name: from
          in: query
          description: Начальная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Конечная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          description: Тип агрегации данных [WIP]
          schema:
            type: string
            enum: [raw, avg, min, max, sum, count]
            default: raw
        - name: interval
          in: query
          description: Интервал агрегации (в минутах) [WIP]
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 1
        - name: limit
          in: query
          description: Количество записей на странице [WIP]
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Смещение для пагинации [WIP]
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Список метрик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
  /api/v1/metrics/latest:
    get:
      tags: [Metrics]
      summary: Получить последние значения метрик [WIP]
      description: Возвращает последние значения метрик для устройств (частично реализовано в MVP)
      parameters:
        - name: device_id
          in: query
          description: Фильтр по устройству [WIP]
          schema:
            type: string
            format: uuid
        - name: house_id
          in: query
          description: Фильтр по дому ✅
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Фильтр по локации ✅
          schema:
            type: string
            maxLength: 128
        - name: metric_codes
          in: query
          description: Список типов метрик через запятую [WIP]
          schema:
            type: string
            example: "temperature,humidity,power"
      responses:
        "200":
          description: Последние значения метрик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestMetricsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
  /api/v1/metrics/statistics:
    get:
      tags: [Statistics]
      summary: Получить статистику по метрикам [WIP]
      description: Возвращает статистические данные по метрикам за указанный период (не реализовано в MVP)
      parameters:
        - name: device_id
          in: query
          description: Фильтр по устройству [WIP]
          schema:
            type: string
            format: uuid
        - name: house_id
          in: query
          description: Фильтр по дому ✅
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Фильтр по локации ✅
          schema:
            type: string
            maxLength: 128
        - name: metric_code
          in: query
          description: Тип метрики ✅
          schema:
            type: string
            maxLength: 64
            enum: [temperature, humidity, power, motion, pressure]
        - name: from
          in: query
          description: Начальная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Конечная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          description: Группировка данных [WIP]
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        "200":
          description: Статистика по метрикам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
  /api/v1/metrics/export:
    get:
      tags: [Metrics]
      summary: Экспорт телеметрических данных [WIP]
      description: Экспортирует данные в различных форматах (не реализовано в MVP)
      parameters:
        - name: device_id
          in: query
          description: Фильтр по устройству [WIP]
          schema:
            type: string
            format: uuid
        - name: house_id
          in: query
          description: Фильтр по дому ✅
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Фильтр по локации ✅
          schema:
            type: string
            maxLength: 128
        - name: metric_code
          in: query
          description: Тип метрики ✅
          schema:
            type: string
            maxLength: 64
            enum: [temperature, humidity, power, motion, pressure]
        - name: from
          in: query
          description: Начальная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Конечная дата (ISO 8601) [WIP]
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          description: Формат экспорта [WIP]
          schema:
            type: string
            enum: [csv, json, xlsx]
            default: csv
      responses:
        "200":
          description: Файл с данными
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryData'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/BadRequest'
  /health:
    get:
      tags: [Health]
      summary: Проверка состояния сервиса
      description: Возвращает статус работы сервиса телеметрии
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    TelemetryData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор записи
        device_id:
          type: string
          format: uuid
          description: ID устройства
        metric_code:
          type: string
          description: Код метрики
          example: "temperature"
        value:
          type: object
          description: Значение метрики (может быть числом, объектом, строкой)
          additionalProperties: true
          example:
            temperature: 22.5
            unit: "celsius"
            quality: "good"
        received_at:
          type: string
          format: date-time
          description: Время получения данных
        partition_ym:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: Партиция по году-месяцу (YYYY-MM)
          example: "2024-01"
    MetricsResponse:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryData'
        total:
          type: integer
          description: Общее количество записей
        limit:
          type: integer
          description: Количество записей на странице
        offset:
          type: integer
          description: Смещение для пагинации
        aggregation:
          type: string
          description: Примененная агрегация
        interval_minutes:
          type: integer
          description: Интервал агрегации в минутах
    LatestMetricsResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        metrics:
          type: array
          items:
            type: object
            properties:
              metric_code:
                type: string
                example: "temperature"
              value:
                type: object
                additionalProperties: true
              received_at:
                type: string
                format: date-time
    StatisticsResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        metric_code:
          type: string
        period:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        statistics:
          type: object
          properties:
            count:
              type: integer
              description: Количество измерений
            avg:
              type: number
              format: float
              description: Среднее значение
            min:
              type: number
              format: float
              description: Минимальное значение
            max:
              type: number
              format: float
              description: Максимальное значение
            sum:
              type: number
              format: float
              description: Сумма значений
            std_dev:
              type: number
              format: float
              description: Стандартное отклонение
        grouped_data:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                description: Период группировки
              count:
                type: integer
              avg:
                type: number
                format: float
              min:
                type: number
                format: float
              max:
                type: number
                format: float
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
          description: Общий статус сервиса
        database:
          type: string
          enum: [connected, disconnected, error]
          description: Статус подключения к БД
        message_queue:
          type: string
          enum: [connected, disconnected, error]
          description: Статус подключения к очереди сообщений
        uptime_seconds:
          type: integer
          description: Время работы сервиса в секундах
        version:
          type: string
          description: Версия сервиса
        timestamp:
          type: string
          format: date-time
          description: Время проверки
    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
        code:
          type: string
          description: Код ошибки
        details:
          type: object
          description: Дополнительные детали ошибки
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
