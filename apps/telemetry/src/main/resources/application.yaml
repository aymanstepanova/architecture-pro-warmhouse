server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/telemetry}
    username: ${SPRING_DATASOURCE_USERNAME:telemetry}
    password: ${SPRING_DATASOURCE_PASSWORD:telemetry}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: telemetry
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
