version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/docker_postgres_init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d smarthome" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - smarthome-network
  # расскомментировать, чтобы подключиться локально к БД по порту 15432
  #  ports:
  #    - "15432:5432"
  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    restart: always
    environment:
      VIRTUAL_HOST: temperature-api
      VIRTUAL_PORT: 8081
    healthcheck:
      test: curl --fail -s http://localhost:8081/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6
    networks:
      - smarthome-network
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    healthcheck:
      test: curl --fail -s http://temperature-api:8081/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
  telemetry-postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    environment:
      - POSTGRES_USER=telemetry
      - POSTGRES_PASSWORD=telemetry
    volumes:
      - telemetry_pg_data:/var/lib/postgresql/data
      - ./telemetry/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d telemetry" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - smarthome-network
  # расскомментировать, чтобы подключиться локально к БД по порту 15432
  #  ports:
  #    - "15432:5432"
  telemetry-service:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
    image: telemetry:0.1.0
    container_name: telemetry-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://telemetry-postgres:5432/telemetry
      - SPRING_DATASOURCE_USERNAME=telemetry
      - SPRING_DATASOURCE_PASSWORD=telemetry
    healthcheck:
      test: curl --fail -s http://localhost:8082/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6
    depends_on:
      telemetry-postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - smarthome-network

  device-postgres:
    image: postgres:16-alpine
    container_name: device-postgres
    environment:
      - POSTGRES_USER=devman
      - POSTGRES_PASSWORD=devman
    volumes:
      - device_pg_data:/var/lib/postgresql/data
      - ./device-management/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d device_mgmt" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - smarthome-network
    # расскомментировать, чтобы подключиться локально к БД по порту 15432
    ports:
      - "35432:5432"
  device-management-service:
    build:
      context: ./device-management
      dockerfile: Dockerfile
    image: device-management:0.1.0
    container_name: device-management-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://device-postgres:5432/device_mgmt
      - SPRING_DATASOURCE_USERNAME=devman
      - SPRING_DATASOURCE_PASSWORD=devman
    healthcheck:
      test: curl --fail -s http://localhost:8083/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6
    depends_on:
      device-postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - smarthome-network

volumes:
  postgres_data:
  telemetry_pg_data:
  device_pg_data:

networks:
  smarthome-network:
    driver: bridge