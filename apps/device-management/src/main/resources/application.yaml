server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://device-postgres:5432/device_mgmt
    username: devman
    password: devman
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: device_mgmt
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
